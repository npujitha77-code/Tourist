        e.target.src = fallbackSrc;
      };

          alt={alt}
          className={className}
          loading="lazy"
          onError={handleError}
          onClick={onClick}
        />
      );

      const [budgetCalc, setBudgetCalc] = useState({
        travellers: 2,
        days: 4,
        travelMode: "train", // flight, train, bus, cab
        accommodation: "midrange", // budget, midrange, heritage, luxury
        foodTier: "medium", // budget, medium, luxury
        activityTier: "medium" // standard, medium, luxury
      });

      useEffect(() => {

          localStorage.setItem("explore_karnataka_favorites", JSON.stringify(favorites));

          console.error("Failed to save to localStorage", e);
        }
      }, [favorites]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      // Toggle Favorites
      const toggleFavorite = (id, name) => {
        if (favorites.includes(id)) {
          setFavorites(favorites.filter(favId => favId !== id));
          showToast(`Removed "${name}" from your Favorites.`);

          setFavorites([...favorites, id]);

      };

        const pool = data.destinations;
        const randomIndex = Math.floor(Math.random() * pool.length);
        setSurpriseModal(pool[randomIndex]);
      };

      // Filtered Destinations
      const filteredDestinations = useMemo(() => {
        return data.destinations.filter(item => {
          const matchesCategory = selectedCategory === "all" || item.category === selectedCategory;
          const matchesDistrict = selectedDistrict === "All Districts" || item.district.toLowerCase() === selectedDistrict.toLowerCase();
          const query = searchQuery.trim().toLowerCase();
          const matchesSearch = !query || 
            item.name.toLowerCase().includes(query) ||
            item.district.toLowerCase().includes(query) ||
            item.shortDesc.toLowerCase().includes(query) ||
            item.tagline.toLowerCase().includes(query);

          return matchesCategory && matchesDistrict && matchesSearch;
        });
      }, [data.destinations, selectedCategory, selectedDistrict, searchQuery]);

      // Filtered Gallery Items
      const filteredGallery = useMemo(() => {
        if (activeGalleryTab === "all") return data.gallery;
        return data.gallery.filter(item => item.category === activeGalleryTab);
      }, [data.gallery, activeGalleryTab]);

      // Budget Calculation Logic
      const budgetResult = useMemo(() => {
        const { travellers, days, travelMode, accommodation, foodTier, activityTier } = budgetCalc;

        // Transport cost per person round-trip
        const transportRates = {
          flight: 6500,
          train: 1400,
          bus: 1800,
          cab: 4000
        };

        // Room rate per night (assuming 2 persons per room)
        const roomRates = {
          budget: 1200,
          midrange: 2800,
          heritage: 6500,
          luxury: 14000
        };

        // Food cost per person per day
        const foodRates = {
          budget: 450,
          medium: 950,
          luxury: 2000
        };

        // Activity cost per person per day
        const activityRates = {
          standard: 350,
          medium: 1100,
          luxury: 2500
        };

        const roomsNeeded = Math.ceil(travellers / 2);
        const transportTotal = transportRates[travelMode] * travellers;
        const accommodationTotal = roomRates[accommodation] * roomsNeeded * days;
        const foodTotal = foodRates[foodTier] * travellers * days;
        const activityTotal = activityRates[activityTier] * travellers * days;

        const totalCost = transportTotal + accommodationTotal + foodTotal + activityTotal;
        const perPersonCost = Math.round(totalCost / travellers);

        return {
          transportTotal,
          accommodationTotal,
          foodTotal,
          activityTotal,
          totalCost,
          perPersonCost
        };
      }, [budgetCalc]);
